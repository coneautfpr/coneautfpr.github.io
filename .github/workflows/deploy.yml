name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Site completo: só quando a variável do repositório SITE_PUBLICADO for "true"
      # (Settings > Secrets and variables > Actions > Variables).
      - uses: actions/setup-node@v7
        if: vars.SITE_PUBLICADO == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Gerar o site completo
        if: vars.SITE_PUBLICADO == 'true'
        run: |
          npm ci
          npm run build

      # Enquanto isso, publica só a página "em construção" (também usada como 404)
      - name: Gerar a página em construção
        if: vars.SITE_PUBLICADO != 'true'
        run: |
          mkdir -p _site/assets/img _site/assets/fonts
          cp construcao/index.html _site/index.html
          cp construcao/index.html _site/404.html
          cp src/assets/img/conea.png src/assets/img/conea_deitado.png _site/assets/img/
          cp src/assets/fonts/raleway-latin.woff2 src/assets/fonts/assistant-latin.woff2 _site/assets/fonts/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
